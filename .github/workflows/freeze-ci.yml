name: VM6 Freeze CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  vm6-freeze-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Hold long enough to apply freeze
        run: |
          echo "VM6_FREEZE_CI_STARTED=$(date -u +%FT%TZ)"
          sleep 180
          echo "VM6_FREEZE_CI_FINISHED=$(date -u +%FT%TZ)"
