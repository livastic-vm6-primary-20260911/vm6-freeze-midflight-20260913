name: VM6 MP Head Race Gate
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  vm6-mp-race-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Revision-sensitive gate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "title=$PR_TITLE commits=$PR_COMMITS head=$HEAD_SHA"
          if [ "$PR_TITLE" != "VM6_MP_HEAD_RACE_20260925" ]; then
            echo "not the race fixture"
            exit 0
          fi
          if [ "$PR_COMMITS" -ge 2 ]; then
            echo "H1 or later: hold pending, then fail"
            sleep 180
            exit 1
          fi
          echo "H0: success"
